product: jvm/lib

description: Integration test for Kotlin Toolchain Maven Central bundles

settings:
  jvm:
    jdk:
      version: 25
      distributions: [temurin]
  publishing:
    enabled: true
    group: io.heapy.actionfixture
    artifactId: bundle-test
    version: 0.0.0-ci
    mavenCentral:
      enabled: true
      publishingMode: manual
    signArtifacts: true
    publishSources: true
    pom:
      name: Action integration fixture
      url: https://github.com/Heapy/ktc-publish
      scm: https://github.com/Heapy/ktc-publish
      developers:
        - name: Heapy
      licenses:
        - name: Apache License 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0
